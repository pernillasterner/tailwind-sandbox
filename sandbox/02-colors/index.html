<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Colors</title>
  </head>
  <body>
    <!-- Default colors -->
    <!-- white, black, red, green, blue, orange, yellow, purple, lime, emerald, teal, cyan, indigo, violet, fuchsia, pink, rose, sky, gray, slate, zinc, neutral, stone, amber,  -->

    <!-- Text Colors -->
    <p class="text-black">Black</p>
    <p class="text-red-500">Red - 300</p>
    <p class="text-red-500">Red - 900</p>
    <p class="text-emerald-500">Red - 900</p>
    <p class="text-slate-500">Red - 800</p>

    <!-- Background Colors -->
    <p class="bg-emerald-500 text-yellow-500">Red - 900</p>
    <p class="bg-slate-500">Red - 800</p>
    <p class="bg-yellow-500">Red - 900</p>
    <p class="bg-indigo-500 text-pink-400">Red - 800</p>

    <!-- Text Underline -->
    <p class="underline decoration-red-500">Red - 900</p>
    <p class="underline decoration-emerald-500">Red - 900</p>

    <!-- Border Colors -->
    <input type="text" class="border border-orange-400" />
    <input type="text" class="border border-blue-400" />
    <input type="text" class="border border-green-700" />
    
    <!-- Divide Colors -->
    <div class="divide-y divide-blue-500">
      <div>Item 1</div>
      <div>Item 2</div>
      <div>Item 3</div>
      <div>Item 4</div>
      <div>Item 5</div>
    </div>

    <!-- Outline Colors -->
     <button class="outline outline-red-500">Hello</button>
     <button class="outline outline-blue-200">World</button>

    <!-- Box Shadow Colors (Opacity defaults to 100, but you can set it)-->
    <button class="shadow-lg bg-cyan-500 shadow-cyan-500">Subscribe</button>
    <button class="shadow-lg bg-cyan-500 shadow-purple-500/50">Subscribe</button>
    
    <!-- Accent Colors -->
    <input type="checkbox" class="accent-purple-500" checked/>
    <input type="checkbox" class="accent-cyan-500" checked/>

    <!-- Arbitrary Colors -->
     <div class="bg-[#427fab]">Hello</div>
     <div class="bg-[rgb(255,0.0)]">Hello</div>
     <div class="bg-[steelblue]">Hello</div>
  </body>
</html>
